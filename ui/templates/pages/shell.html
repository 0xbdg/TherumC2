{% extends "base.html" %}

{% block title %} Shell | {{ id }} {% endblock %}

{% block contents %}
      <div class="console">
        <div id="terminal"></div>
      </div>

      <script>
        const ws = io()
        var term = new Terminal({
              cursorBlink: true,
        });
        let command = ""
        term.open(document.getElementById('terminal'));
        term.write("[agent@{{ id }}]:~# ");
        term.onData(data => {
            if (data === '\r'){
                term.write("\r\n");

                if (data === "clear"){
                    term.clear();
                }

                else{
                    term.write("command not found\r\n");
                }

                command="";
            }

            else if (data === '\x7f'){
                if (command.length > 0) {
                    command = command.slice(0, -1);
                    term.write('\b \b');
                }
               
            }
            else{
                command+=data
                term.write(data);
            }
        });
      </script>
{% endblock %}
